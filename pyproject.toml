[project]
name = "scarwright"
version = "0.0.1"
description = "A codebase's case law: decisions found in its history, turned into checks, and proven against that history before they may flag anything."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Scarwright contributors" }]
requires-python = ">=3.10"
dependencies = [
  "typer>=0.16,<1.0",
  "pyyaml>=6.0,<7.0",
  "jinja2>=3.1,<4.0",
  "rich>=13.0",
  "tomli>=2.0,<3.0; python_version < '3.11'",
]

[project.scripts]
scarwright = "scarwright.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scarwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
