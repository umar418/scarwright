# Known credential formats. Every pattern is anchored so it cannot match in
# the middle of an ordinary word (e.g. "disk-..." must not match "sk-...").
# Order matters: the first pattern to claim a value names it.
- id: private-key-block
  name: Private key
  pattern: '-----BEGIN [A-Z ]*PRIVATE KEY-----[\s\S]{0,8000}?(?:-----END [A-Z ]*PRIVATE KEY-----|$)'
- id: anthropic-api-key
  name: Anthropic API key
  pattern: '(?<![A-Za-z0-9_-])sk-ant-[A-Za-z0-9_-]{20,}'
- id: openai-api-key
  name: OpenAI API key
  pattern: '(?<![A-Za-z0-9_-])sk-(?:proj-|svcacct-|admin-)?[A-Za-z0-9_-]{20,}'
  
- id: google-api-key
  name: Google API key
  pattern: '(?<![A-Za-z0-9_-])AIza[0-9A-Za-z_-]{35}(?![A-Za-z0-9_-])'
- id: google-oauth-token
  name: Google OAuth access token
  pattern: '(?<![A-Za-z0-9_-])ya29\.[0-9A-Za-z_-]{20,}'
- id: aws-access-key-id
  name: AWS access key ID
  pattern: '(?<![A-Za-z0-9])(?:AKIA|ASIA)[0-9A-Z]{16}(?![A-Za-z0-9])'
- id: github-token
  name: GitHub token
  pattern: '(?<![A-Za-z0-9_-])(?:gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{40,})'
- id: gitlab-token
  name: GitLab token
  pattern: '(?<![A-Za-z0-9_-])glpat-[A-Za-z0-9_-]{20,}'
- id: slack-token
  name: Slack token
  pattern: '(?<![A-Za-z0-9_-])xox[baprs]-[A-Za-z0-9-]{10,}'
- id: stripe-key
  name: Stripe API key
  pattern: '(?<![A-Za-z0-9_-])(?:sk|rk)_(?:live|test)_[A-Za-z0-9]{16,}'
- id: sendgrid-key
  name: SendGrid API key
  pattern: '(?<![A-Za-z0-9_-])SG\.[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{16,}'
- id: npm-token
  name: npm token
  pattern: '(?<![A-Za-z0-9_-])npm_[A-Za-z0-9]{36}(?![A-Za-z0-9])'
- id: huggingface-token
  name: Hugging Face token
  pattern: '(?<![A-Za-z0-9_-])hf_[A-Za-z0-9]{30,}'
- id: jwt
  name: JSON Web Token
  pattern: '(?<![A-Za-z0-9_-])eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'
- id: slack-webhook
  name: Slack webhook URL
  pattern: 'https://hooks\.slack\.com/(?:services|workflows|triggers)/[A-Za-z0-9/_-]{8,}'
- id: discord-webhook
  name: Discord webhook URL
  pattern: 'https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/[0-9]+/[A-Za-z0-9_-]{8,}'
